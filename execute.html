<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POC</title>
</head>
<body>
<b id="poc" style="text-align: center; background: cadetblue; display: inline; border-radius: 1%">Double Click Now</b>

<script>
     let element = document.getElementById("poc")
    element.style.position = "absolute"
    element.style.bottom = 130 + "px"
    element.style.right =  570+ "px"


    element.addEventListener("click", () => {
        window.close()
    })



</script>
</body>
</html>
